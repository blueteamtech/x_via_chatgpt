name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    env:
      APP_ENV: testing
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: mbstring, pdo_sqlite, openssl, tokenizer
          coverage: none

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Prepare Laravel
        run: |
          cp .env.example .env
          php artisan key:generate
          php artisan passport:keys --no-interaction
          mkdir -p database
          touch database/database.sqlite

      - name: Pint
        run: vendor/bin/pint --test

      - name: Tests
        run: php artisan test

  deploy:
    needs: tests
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Laravel Cloud after green CI
        env:
          HOOK: ${{ secrets.LARAVEL_CLOUD_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "No LARAVEL_CLOUD_DEPLOY_HOOK secret. Laravel Cloud push-to-deploy can still ship this commit."
            exit 0
          fi
          curl --fail -X POST "${HOOK}?commit_hash=${GITHUB_SHA}"
